[project]
name = "local-voice-assistant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "av>=11,<18",
    "fastapi>=0.162.5",
    "faster-whisper>=1.1,<2",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "python-multipart>=0.0.20",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
